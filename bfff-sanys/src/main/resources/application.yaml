spring:
  application:
    name: bff-sanys
  datasource:
    url: jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&socketTimeout=30
    username: postgres.kyfjhyibpcipywtvdalk
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2  # Control estricto de conexiones para que no colapse Supabase
      minimum-idle: 1
      max-lifetime: 60000
      keepalive-time: 30000
      connection-timeout: 30000
      idle-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8090

logging:
  level:
    org.springframework.security: DEBUG

management:
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      # Apunta dinámicamente al contenedor de Eureka
      defaultZone: http://admin:password123@${EUREKA_HOST:localhost}:8761/eureka
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

supabase:
  url: https://kyfjhyibpcipywtvdalk.supabase.co
  anon-key: ${SUPABASE_ANON_KEY}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  jwks-uri: https://kyfjhyibpcipywtvdalk.supabase.co/auth/v1/.well-known/jwks.json


ms:
  registro:
    url: http://${GATEWAY_HOST:localhost}:8081/api-registro-sys  # O el contexto correspondiente de tu ruteo
  login:
    url: https://kyfjhyibpcipywtvdalk.supabase.co
  reportes:
    url: http://${GATEWAY_HOST:localhost}:8081/api-reporte