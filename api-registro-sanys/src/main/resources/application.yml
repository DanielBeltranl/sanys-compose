supabase:
  url: https://kyfjhyibpcipywtvdalk.supabase.co
  anon-key: ${SUPABASE_ANON_KEY}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}


eureka:
  client:
    service-url:

      defaultZone: http://admin:password123@${EUREKA_HOST:localhost}:8761/eureka
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

spring:
  application:
    name: api-registro

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://kyfjhyibpcipywtvdalk.supabase.co/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256

  datasource:
    url: jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&socketTimeout=30
    username: postgres.kyfjhyibpcipywtvdalk
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      max-lifetime: 60000
      keepalive-time: 30000
      connection-timeout: 30000
      idle-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public